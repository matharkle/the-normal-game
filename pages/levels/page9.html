<!DOCTYPE html>
<html lang="en">

<head>
    <title>level 4 - the normal game</title>
    <link rel="stylesheet" href="https://use.typekit.net/iqq5oek.css">
    <link rel="stylesheet" href="../../main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <div class="header">
        <div class="logo"><img src="../../assets/logo_small.png" alt="The Normal Game logo"></div>
        <div class="menu-bar">
            <button class="help" onclick="document.location='../../index.html'">Start Over</button>
            <button class="help" onclick="document.location='../help.html'">Hint</button>
        </div>
        <!-- <div>matt christian</div>
        <div>vcu gdes 2026 capstone</div> -->
    </div>

    <div class="main">
        <div class="instr">
            You found a power up!<br>
            &nbsp;<br>
            To collect it, click the top arrow last, and then the bottom arrow third.
        </div>
        <div class="spacer-small"></div>
        <div class="game">
            <div class="powerup">powerup</div>
            <div class="game">
                <button class="arrow one">A</button>
                <button class="arrow two">B</button>
            </div>
        </div>
    </div>

    <script>

        const state = {A: false, B: false};

        addEventListener('click', (e) => {

            const buttonClicked = e.target.innerHTML;
            state[buttonClicked] = true;

            console.log(Object.values(state));

            if(Object.values(state).includes(false)) {
                console.log('not all buttons are clicked');
            } else {
                console.log('all buttons are clicked');
                // Do what you got to do here
                document.location="page10.html";
            }
            
        });

    </script>
    
</body>

</html>
