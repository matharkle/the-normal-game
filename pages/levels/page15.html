<!DOCTYPE html>
<html lang="en">

<head>
    <title>level 5 - the normal game</title>
    <link rel="stylesheet" href="https://use.typekit.net/iqq5oek.css">
    <link rel="stylesheet" href="../../main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body onload="gameOver()">

    <div class="header">
        <div class="logo"><img src="../../assets/logo_small.png" alt="The Normal Game logo"></div>
        <div class="menu-bar">
            <button class="help" onclick="document.location='../../index.html'">Start Over</button>
            <button class="help" onclick="document.location='../help.html'">Hint</button>
        </div>
        <!-- <div>matt christian</div>
        <div>vcu gdes 2026 capstone</div> -->
    </div>

    <div class="main">
        <div class="explosion">KABOOM!</div>
    </div>

    <script>
        var delayInMilliseconds = 3000;
        function gameOver() {
            setTimeout(function() {
                document.location="../deathscreen.html"
            }, delayInMilliseconds);
        }
    </script>
    
</body>

</html>
