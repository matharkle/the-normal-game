<!DOCTYPE html>
<html lang="en">

<head>
    <title>level 2 - the normal game</title>
    <link rel="stylesheet" href="https://use.typekit.net/iqq5oek.css">
    <link rel="stylesheet" href="../../main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body onload="attackTimer()">

    <div class="header">
        <div class="logo"><img src="../../assets/logo_small.png" alt="The Normal Game logo"></div>
        <div class="menu-bar">
            <button class="help" onclick="document.location='../../index.html'">Start Over</button>
            <button class="help" onclick="document.location='../help.html'">Hint</button>
        </div>
        <!-- <div>matt christian</div>
        <div>vcu gdes 2026 capstone</div> -->
    </div>

    <div class="main">
        <div class="instr">
            No! You're running out of time!<br>
            &nbsp;<br>
            Quickly!<br>
            Click on the Bad Guy to stop them!<br>
            &nbsp;
        </div>
        <div class="game">
            <button class="circ friend" onclick="document.location='../gameover.html'"></button>
            <button class="circ friend2" onclick="document.location='../gameover.html'"></button>
            <button class="circ friend2" onclick="document.location='../gameover.html'"></button>
        </div>
        <div class="game">
            <button class="circ friend2" onclick="document.location='../gameover.html'"></button>
            <button class="circ friend3" onclick="document.location='page6.html'"></button>
        </div>
        <div class="spacer-small"></div>
        <button class="button" onclick="assistMode()">Assist Mode</button>
    </div>

    <script>

        var delayInMilliseconds = 5000;

        function attackTimer() {

            setTimeout(function() {

                document.location="../gameover.html"

            }, delayInMilliseconds);
        }

        var devil = document.querySelector(".friend3")

        function assistMode() {

            devil.classList.toggle("bad-guy")

        }

    </script>
    
</body>

</html>
