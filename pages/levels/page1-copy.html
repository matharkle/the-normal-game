<!DOCTYPE html>
<html lang="en">

<head>
    <title>the normal game</title>
    <link rel="stylesheet" href="https://use.typekit.net/iqq5oek.css">
    <link rel="stylesheet" href="../../main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <div class="header">
        <div class="logo"><img src="../../assets/logo_small.png" alt="The Normal Game logo"></div>
        <div class="menu-bar">
            <button class="help" onclick="document.location='../../index.html'">Start Over</button>
            <button class="help" onclick="document.location='../help.html'">Hint</button>
        </div>
        <!-- <div>matt christian</div>
        <div>vcu gdes 2026 capstone</div> -->
    </div>

    <div class="main">
        <div class="instr">
            A strange puzzle blocks your way.<br>
            Click on the Blorgle square to continue.
        </div>
        <div class="game">
            <button class="sq plus" onclick="document.location='page3.html'">+</button>
            <button class="sq nill" onclick="assistMode()">o</button>
            <button class="sq min" onclick="assistMode()">-</button>
            <button class="sq than" onclick="assistMode()"><</button>
        </div>
        <div class="instr2 remove">
            Um... not that one, the Blorgle one.<br>
            Here, I'll turn on assist mode for you.
        </div>
    </div>

    <script>

        // var instr = document.querySelector(".instr")
        var instr2 = document.querySelector(".instr2")

        var delayInMilliseconds = 2000;

        function assistMode() {
            // instr.classList.add("remove");
            instr2.classList.remove("remove");

            setTimeout(function() {
                document.location="page2-copy.html"
            }, delayInMilliseconds);
        }

    </script>
    
</body>

</html>
